# Crawl the configured association directories and deliver the dataset.
#
# This workflow is the one place in the public repository that touches a secret, so read the
# reasoning before changing it.
#
# What it produces is a dataset of *companies*: names, websites, careers pages and the
# recruitment addresses those companies published themselves. That is public business
# information. It is not a job seeker's profile, their CV, their drafts or their send
# history — none of which this repository ever holds. That distinction is what makes running
# the crawl here legitimate rather than a way of borrowing public CI minutes for a private
# workflow.
#
# Two delivery routes, in order of preference:
#
#   1. A GitHub Release asset (always). Needs no token beyond the run's own, and anything
#      that can read this repository can fetch it. A private consumer pulling from here is
#      the safest arrangement available, because no credential has to exist.
#
#   2. A commit into the private repository through the Contents API (only when
#      DATASET_REPO_TOKEN is set). Be clear about the cost: a token that can write to a
#      private repository is stored in a public repository's secrets. GitHub keeps it out of
#      logs and withholds it from fork pull requests, but anyone with write access *here*
#      can run a workflow that reads it. Scope it to the single private repository with
#      `contents: write` and nothing else, give it an expiry, and rotate it if this
#      repository's collaborators ever change.
#
# If route 2 is not needed, leave DATASET_REPO_TOKEN unset: route 1 still runs and the
# workflow stays credential-free.

name: Publish dataset

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Only crawl sources for this country code (blank = all)"
        required: false
        type: string
      dry_run:
        description: "Crawl and report, publish nothing"
        required: false
        type: boolean
        default: true
      push_to_private:
        description: "Also commit the dataset into the private repository"
        required: false
        type: boolean
        default: false
  # A schedule is deliberately absent. Add one only if a dataset genuinely needs refreshing
  # on a cadence, and keep it no more frequent than weekly — a member directory does not
  # change daily, and every run is traffic on somebody else's small server.

concurrency:
  group: publish-dataset
  cancel-in-progress: false # never interrupt a run mid-crawl; let it finish and be polite

permissions:
  contents: write # to create the release asset in THIS repository

jobs:
  crawl:
    name: crawl and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # An environment lets you require a manual approval before the secret is available.
    # Configure "dataset" under Settings -> Environments with yourself as a reviewer.
    environment: dataset

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build -ldflags "-s -w" -o eucd ./cmd/eucd

      - name: Validate configuration
        run: ./eucd config validate

      - name: Crawl
        id: crawl
        env:
          COUNTRY: ${{ inputs.country }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${COUNTRY}" ]; then
            args+=(--country "${COUNTRY}")
          fi
          # A deadline below the job timeout, so a long crawl ends cleanly with its
          # partial results stored rather than being killed.
          ./eucd --db dataset.db discover "${args[@]}" | tee crawl.log

          # A crawl that read nothing is a failure, not an empty dataset. Most often it
          # means a selector changed and every source silently returned zero rows.
          if grep -qE '^[0-9]+ source\(s\): 0 record\(s\) read' crawl.log; then
            echo "::error::every source returned zero records — check the selectors"
            exit 1
          fi
          {
            echo "blocked=$(grep -c 'BLOCKED' crawl.log || true)"
            echo "warnings=$(grep -c 'warning:' crawl.log || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Surface blocked sources
        if: steps.crawl.outputs.blocked != '0'
        run: |
          echo "### Sources that refused automated access" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "These are reported, never worked around. Consider marking the association" >> "$GITHUB_STEP_SUMMARY"
          echo "\`disabled: true\` with a \`disabled_reason\`, or finding an official export." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep 'BLOCKED' crawl.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p data
          ./eucd --db dataset.db export --format json -o data/companies.json
          ./eucd --db dataset.db export --format csv  -o data/companies.csv
          ./eucd --db dataset.db db status

      # The dataset is public company information, but a bug or a bad source could still
      # pull in an address belonging to a named individual. The engine refuses those in two
      # places already; this is the third check, on the way out.
      - name: Check the dataset holds no personal addresses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys

          with open("data/companies.json") as fh:
              data = json.load(fh)

          assert data["schema_version"] == "eucd.companies/1", data["schema_version"]
          assert data["count"] == len(data["companies"]), "count disagrees with payload"

          # firstname.lastname@ or f.lastname@ — the engine should never emit these.
          personal = re.compile(r"^(?:[a-z]\.[a-z]{2,}|[a-z]{2,}[._-][a-z]{2,})@", re.I)
          offenders, missing_provenance = [], []
          for company in data["companies"]:
              if not company.get("sources"):
                  missing_provenance.append(company["name"])
              for contact in company.get("contacts", []):
                  if personal.match(contact["address"]):
                      offenders.append(contact["address"])
                  if contact["verification"] == "published" and not contact.get("found_on_url"):
                      offenders.append(f'{contact["address"]} (published, no source page)')

          if offenders:
              print("::error::the dataset holds addresses that look personal, or claims "
                    "publication without naming a page:")
              for item in sorted(set(offenders)):
                  print(f"  {item}")
              sys.exit(1)
          if missing_provenance:
              print("::error::companies with no provenance: "
                    + ", ".join(sorted(missing_provenance)[:10]))
              sys.exit(1)
          print(f"dataset ok: {data['count']} companies, no personal addresses")
          PY

      - name: Summary
        run: |
          {
            echo "### Dataset"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| companies | $(python3 -c 'import json;print(json.load(open("data/companies.json"))["count"])') |"
            echo "| blocked sources | ${{ steps.crawl.outputs.blocked }} |"
            echo "| warnings | ${{ steps.crawl.outputs.warnings }} |"
            echo "| schema | eucd.companies/1 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: data/
          retention-days: 14

      # ---- Route 1: a release asset. No extra credential. ----
      - name: Publish as a release asset
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="dataset-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            --title "Dataset $tag" \
            --notes "Company dataset, schema eucd.companies/1. Public company information only: no profile, CV, drafts or send history." \
            data/companies.json data/companies.csv
          echo "Published release $tag" >> "$GITHUB_STEP_SUMMARY"

      # ---- Route 2: commit into the private repository. Only with a token. ----
      - name: Commit the dataset into the private repository
        if: ${{ !inputs.dry_run && inputs.push_to_private && env.DATASET_REPO_TOKEN != '' }}
        env:
          DATASET_REPO_TOKEN: ${{ secrets.DATASET_REPO_TOKEN }}
          TARGET_REPO: iobyte-labs/personal-outreach
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          # GH_TOKEN is read from the environment by gh and never echoed. Do not add set -x
          # to this step, and do not interpolate the token into a command line.
          export GH_TOKEN="$DATASET_REPO_TOKEN"

          for file in companies.json companies.csv; do
            target="data/$file"

            # The Contents API needs the current blob sha to replace a file, and none when
            # creating it. A 404 here means "not there yet", which is not an error.
            sha=$(gh api "repos/$TARGET_REPO/contents/$target?ref=$TARGET_BRANCH" \
                    --jq .sha 2>/dev/null || true)

            # Compare against what is already there: an unchanged dataset should not
            # produce a commit. A crawl that found nothing new is normal.
            if [ -n "$sha" ]; then
              remote_hash=$(gh api "repos/$TARGET_REPO/contents/$target?ref=$TARGET_BRANCH" \
                              --jq .content | tr -d '\n' | base64 -d | sha256sum | cut -d' ' -f1)
              local_hash=$(sha256sum "data/$file" | cut -d' ' -f1)
              if [ "$remote_hash" = "$local_hash" ]; then
                echo "$target is unchanged; no commit"
                continue
              fi
            fi

            args=(--method PUT "repos/$TARGET_REPO/contents/$target"
                  -f "message=dataset: refresh $file from eu-company-discovery@${GITHUB_SHA::7}"
                  -f "content=$(base64 -w0 "data/$file")"
                  -f "branch=$TARGET_BRANCH")
            if [ -n "$sha" ]; then
              args+=(-f "sha=$sha")
            fi

            gh api "${args[@]}" --jq '.commit.sha' \
              | xargs -I{} echo "committed $target as {}"
          done
          echo "Dataset delivered to $TARGET_REPO" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a skipped private push
        if: ${{ !inputs.dry_run && inputs.push_to_private && env.DATASET_REPO_TOKEN == '' }}
        env:
          DATASET_REPO_TOKEN: ${{ secrets.DATASET_REPO_TOKEN }}
        run: |
          echo "::warning::push_to_private was requested but DATASET_REPO_TOKEN is not set." \
               "The release asset was still published; the private consumer can pull from it."
          {
            echo "### Private push skipped"
            echo ""
            echo "\`DATASET_REPO_TOKEN\` is not configured. To enable it, create a"
            echo "**fine-grained** personal access token scoped to \`iobyte-labs/personal-outreach\`"
            echo "only, with **Contents: write** and nothing else, give it an expiry, and add it"
            echo "as a secret on the \`dataset\` environment of this repository."
            echo ""
            echo "Or leave it unset and have the private repository pull the release asset —"
            echo "that way no credential exists at all."
          } >> "$GITHUB_STEP_SUMMARY"
