# Germany.
#
# Adding a country means adding a file like this one and nothing else — no engine change.
# See docs/adding-a-country.md.

code: de
name: Germany
languages: [de, en]

# The sixteen Länder. Aliases carry the real weight here: directories print the German
# name, the English name, and often just the largest city. Accents and case are handled by
# normalisation; genuinely different names are not, and a company whose region cannot be
# resolved scores nothing on geography for no good reason.
regions:
  - code: bw
    name: Baden-Württemberg
    aliases: [Baden-Wuerttemberg, Baden Wurttemberg, Stuttgart, Karlsruhe, Mannheim, Freiburg]
  - code: by
    name: Bayern
    aliases: [Bavaria, München, Muenchen, Munich, Nürnberg, Nuernberg, Nuremberg, Augsburg]
